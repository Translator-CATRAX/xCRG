[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "catrax-xcrg"
version = "0.1.0"
description = "Reusable xCRG MVP2 TRAPI response generation."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Translator CATRAX" }
]
dependencies = [
    "bmt>=1.4.8", # Match min. RTX pin
    "httpx~=0.28",
    "opentelemetry-api>=1.17.0", # Match min. RTX pin
    "translator_tom>=2.0.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

[dependency-groups]
dev = [
    "opentelemetry-sdk==1.44.0",
    "optuna==4.9.0",
    "pyright==1.1.414",
    "pytest==9.1.1",
    "pytest-xdist==3.8.0",
    "ruff==0.16.10",
    "ty==0.0.84"
]

[project.urls]
Homepage = "https://github.com/Translator-CATRAX/xCRG"
Issues = "https://github.com/Translator-CATRAX/xCRG/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"xcrg.resources" = ["*.json"]

[tool.pytest.ini_options]
# Additional pytest configuration is performed in tests/conftest.py
# See scripts/run_tests for additional context, etc.
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff.lint]
ignore = [
    "BLE001", # blind-except
    "E701",   # multiple-statements-on-one-line-colon
    "RUF018", # assignment-in-assert (We do this a lot to help the type-checker)
    "TRY002", # raise-vanilla-class
]