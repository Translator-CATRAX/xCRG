[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "catrax-xcrg"
version = "0.1.0"
description = "Reusable xCRG MVP2 TRAPI response generation."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Translator CATRAX" }
]
dependencies = [
    "bmt>=1.4.8", # Match min. RTX pin
    "httpx~=0.28",
    "opentelemetry-api>=1.17.0", # Match min. RTX pin
    "translator_tom>=2.0.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

[dependency-groups]
dev = [
    "opentelemetry-sdk==1.44.0",
    "optuna==5.0.0",
    "pytest==9.1.1",
    "pytest-xdist==3.8.0",
    "ruff==0.17.1",
    "ty==0.0.90"
]

[project.urls]
homepage = "https://github.com/Translator-CATRAX/xCRG"
issues = "https://github.com/Translator-CATRAX/xCRG/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"xcrg.resources" = ["*.json"]

[tool.pytest.ini_options]
# Additional pytest configuration is performed in tests/conftest.py
# See scripts/run_tests for additional context, etc.
pythonpath = ["src"]
testpaths = ["tests"]
